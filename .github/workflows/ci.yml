# Lints the code, checks the move and evolution tables, and runs the plugin's tests on
# every pull request and push to main. A push to main that passes and carries a feat,
# fix, or perf commit since the last release cuts a new release with git-cliff: it bumps
# the plugin's version, updates CHANGELOG.md, tags it, and publishes the GitHub release.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint with Biome
        run: npx --yes @biomejs/biome@2.5.15 ci --error-on-warnings .

      - name: Check the move, evolution, and sprite tables
        run: node scripts/check-data.mjs

  test:
    name: Plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate the plugin
        run: claude plugin validate .

      - name: Run the plugin tests
        run: claude plugin test .

  release:
    name: Release
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      # git-cliff prints the last tag again when nothing since it bumps the version
      - name: Work out the next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          next=$(git cliff --bumped-version)
          echo "Last release: ${last:-none}. Next: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "$next" != "$last" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; fi

      - name: Bump the version and the changelog, then tag
        if: steps.version.outputs.release == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          sed -i -E "s/(\"version\": \")[^\"]+/\1${NEXT#v}/" .claude-plugin/plugin.json
          git cliff --bump --output CHANGELOG.md
          git cliff --bump --unreleased --strip all --output "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "chore(release): $NEXT"
          git tag "$NEXT"
          git push origin HEAD:main "$NEXT"

      - name: Publish the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "$NEXT" --title "$NEXT" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
