# git-cliff builds CHANGELOG.md and each release's notes from the conventional commits.
# Features bump the minor version, fixes and performance work the patch, and docs,
# tests, refactors, and chores don't release on their own.

[changelog]
header = """
# Changelog

Every release of the pokemon mod, generated from its commits by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Docs" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(chore|ci|build|style)", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

[bump]
initial_tag = "v0.6.0"
no_increment_regex = "^(docs|test|refactor|chore|ci|build|style)"
